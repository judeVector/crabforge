[package]
name = "dht11"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-sync = "0.6"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
panic-probe = "1.0.0"
embassy-usb = "0.6.0"
static_cell = "2.1.1"
heapless = "0.9.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "dht11"
path = "src/main.rs"
test = false
doctest = false
bench = false
